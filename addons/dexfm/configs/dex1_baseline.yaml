# DEX1 baseline (configuration DEX1-A): 4 thrust chambers, 2 powerpacks, dual expander,
# oxygen-cooled barrel section. All values are design inputs; results are generated by the toolchain.
name: DEX1-A
thrust_total: 180000.0     # N vacuum, whole propulsion system
n_chambers: 4
n_packs: 2
of: 6.0
pc: 5.0e6                  # Pa; below the maximum closing pressure with heat transfer 20 % under prediction
exit_area_total: 3.0       # m2, sum of the four nozzle exits
cr: 4.0
lstar: 2.0                 # m; long chamber for heat pickup
eps_regen: 12.0
ox_zone: barrel
ox_param: 0.7              # oxygen cools the 70 % of the cylinder next to the injector
