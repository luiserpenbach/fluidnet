[project]
name = "dexfm"
version = "0.2.3"
description = "Foundation model for a dual expander hydrogen/oxygen rocket engine: cycle, thrust chamber cooling, turbopumps, throttle and start"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "CoolProp", "cantera", "pydantic>=2", "pyyaml", "plotly"]

[project.optional-dependencies]
dev = ["pytest"]
network = ["fluidnet>=0.5"]
h2cea = ["rocketcea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
