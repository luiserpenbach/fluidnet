name: RL10A-3-3A
description: >
  Pratt & Whitney RL10A-3-3A closed expander (16,500 lbf, LOX/LH2) built from the
  published component data in NASA TM-107318 and CR-190786. Two-stage fuel pump,
  regeneratively cooled tube jacket (180 short tubes down the nozzle, 180 long
  tubes back to the injector end), flow venturi, two-stage impulse turbine with
  thrust control bypass valve (TCV), LOX pump geared 1:2.5 to the fuel pump shaft,
  mixture ratio valve, oxidizer control valve (OCV) with start bleed, coaxial
  injector and a 4.94 in throat diameter chamber with area ratio 61. Steady
  operation at test point 1 of CR-190786.
# Calibrated at TP1 by validation/rl10/rl10.py (all other values are published
# data or stated assumptions, see docs/VALIDATION.md):
#   fuel_pump_1/2 design_dp (head factor 0.941 on the published stage heads),
#   jacket hot_htc_factor, jacket_up_chamber K, turbine area and design_eff,
#   fuel_injector cd, lox_injector cd, tca cf_eff; valve settings mr_valve and
#   tcv opening (TCV assumed fully open at TP1).
