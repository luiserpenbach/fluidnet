name: GN2 bottle blowdown
description: 50 L nitrogen bottle at 300 bar vented through a line, valve and 3 mm orifice. Choked flow, adiabatic cooling of the bottle.
components:
  - {id: bottle, type: tank, fluid: N2, volume: 50 L, P0: 300 bar, T0: 290 K, ui: {x: 40, y: 140}}
  - {id: line, type: pipe, length: 2 m, diameter: 10 mm, segments: 6, ui: {x: 220, y: 150}}
  - {id: vent_valve, type: valve, diameter: 8 mm, cd: 0.8, opening: [[0, 0], [0.1, 0], [0.3, 1]], ui: {x: 400, y: 150}}
  - {id: orifice, type: orifice, diameter: 3 mm, cd: 0.8, ui: {x: 560, y: 150}}
  - {id: ambient, type: boundary, fluid: N2, P: 1 bar, T: 290 K, ui: {x: 720, y: 140}}
connections:
  - [bottle, line.in]
  - [line.out, vent_valve.in]
  - [vent_valve.out, orifice.in]
  - [orifice.out, ambient]
simulation: {t_end: 60, output_dt: 0.1, rtol: 1e-4}
