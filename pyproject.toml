[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "fluidnet"
version = "0.5.0"
description = "Fluid network and engine-cycle simulation: transient and steady state, real-fluid properties, Rust core"
requires-python = ">=3.8"
dependencies = ["numpy"]
optional-dependencies = { plot = ["matplotlib"], pandas = ["pandas"] }
license = { text = "MIT" }

[tool.maturin]
manifest-path = "crates/fluidnet-py/Cargo.toml"
python-source = "python"
module-name = "fluidnet._core"
features = []
include = [{ path = "python/fluidnet/fluids/*.fntb", format = ["sdist", "wheel"] }]
