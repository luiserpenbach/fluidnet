[workspace]
resolver = "2"
members = ["crates/fluidnet-core", "crates/fluidnet-cli", "crates/fluidnet-wasm", "crates/fluidnet-py"]
default-members = ["crates/fluidnet-core", "crates/fluidnet-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
