name: GN2 regulator
components:
  - {id: bottle, type: boundary, fluid: N2, P: 200 bar, T: 290 K}
  - {id: reg, type: regulator, diameter: 3 mm, set_pressure: 30 bar, band: 2 bar}
  - {id: plenum, type: tank, fluid: N2, volume: 2 L, P0: 1 bar, T0: 290 K}
  - {id: vent, type: orifice, diameter: 2 mm, cd: 0.8}
  - {id: amb, type: boundary, fluid: N2, P: 1 bar, T: 290 K}
connections: [[bottle, reg.in], [reg.out, plenum], [plenum, vent.in], [vent.out, amb]]
simulation: {t_end: 5, output_dt: 0.01}
