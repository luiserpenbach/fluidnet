name: N2 blowdown (validation)
components:
  - {id: tank, type: tank, fluid: N2, volume: 50 L, P0: 10 bar, T0: 300 K}
  - {id: orf, type: orifice, diameter: 3 mm, cd: 1.0}
  - {id: amb, type: boundary, fluid: N2, P: 1 bar, T: 300 K}
connections:
  - [tank, orf.in]
  - [orf.out, amb]
simulation: {t_end: 6, output_dt: 0.5, rtol: 1e-5}
